name: Deploy Hey (Docker Compose)

on:
  push:
    branches: [sandbox]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy (build + docker compose)
        run: |
          docker-compose down || true
          docker-compose build --no-cache
          docker-compose up -d
