name: Deploy to EC2 (Docker Compose)

on:
  push:
    branches: [ sandbox ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          cd "$GITHUB_WORKSPACE"

          docker compose down || true
          docker compose build --no-cache web
          docker compose up -d

          docker compose ps
