name: Deploy Hey (Docker Compose)

on:
  push:
    branches: [sandbox]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy on EC2 (pull + compose)
        shell: bash
        run: |
          set -euo pipefail

          cd /home/ec2-user/hey

          git fetch origin
          git checkout sandbox
          git reset --hard origin/sandbox

          docker-compose down || true
          docker-compose build --no-cache
          docker-compose up -d

          docker ps
